name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - run: npx cap sync android

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias qwrecord -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qwrecord123 -keypass qwrecord123 \
            -dname "CN=QWRecord, OU=Dev, O=Dev, L=, S=, C=CN"

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
